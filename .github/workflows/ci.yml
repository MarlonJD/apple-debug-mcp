name: Apple Debug MCP CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Resolve Swift package
        run: swift package resolve

      - name: Run core and MCP checks
        run: make pr-check

      - name: Build unsigned package
        run: make package

      - name: Upload unsigned package
        uses: actions/upload-artifact@v7
        with:
          name: apple-debug-mcp-macos-unsigned
          path: dist/*.tar.gz
          if-no-files-found: error

  host-integration:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Resolve Swift package
        run: swift package resolve

      - name: Run host integration tier
        run: make host-integration-check

  simulator-integration:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Resolve Swift package
        run: swift package resolve

      - name: Run Simulator integration tier
        run: make simulator-check-core

  simulator-repro-bundle:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Resolve Swift package
        run: swift package resolve

      - name: Run Simulator repro-bundle tier
        run: make simulator-repro-bundle-check
